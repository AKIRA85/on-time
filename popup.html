<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Time</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Sign-in Screen -->
        <div id="auth-section">
            <div class="signin-content">
                <h1>On Time</h1>
                <p class="signin-subtitle">Never miss a meeting again</p>
                <button id="loginBtn" class="primary-btn">Sign in with Google</button>
                <p id="login-error" class="error-message hidden"></p>
            </div>
        </div>

        <!-- Main App Screen -->
        <div id="app-section" class="hidden">
            <header>
                <h1>On Time</h1>
                <div style="display: flex; gap: 8px;">
                    <button id="settingsBtn" title="Settings"><i class="fa-solid fa-gear"></i></button>
                    <button id="refreshBtn" title="Refresh Events"><i class="fa-solid fa-rotate"></i></button>
                </div>
            </header>
            <div id="app-error" class="error-banner hidden">
                <span id="app-error-text"></span>
                <button id="reSignInBtn" class="text-btn hidden">Sign in again</button>
            </div>
            <h2>Next Meeting</h2>
            <div id="next-meeting-card">
                <p class="placeholder">No upcoming meetings found.</p>
            </div>

            <h2 id="later-heading" class="hidden">Later Today</h2>
            <div id="later-meetings-list" class="meetings-list"></div>
        </div>

        <div id="settings-view" class="hidden">
            <div style="display: flex; align-items: center; margin-bottom: 16px;">
                <button id="backBtn" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 style="margin: 0 0 0 8px;">Settings</h2>
            </div>

            <div class="setting-item">
                <label for="newWindowToggle">Open in new window</label>
                <input type="checkbox" id="newWindowToggle">
            </div>
            <div class="setting-item">
                <label for="tentativeToggle">Include tentative events</label>
                <input type="checkbox" id="tentativeToggle">
            </div>
            <p class="settings-note">
                Note: Meetings with <strong>DECLINED</strong> or <strong>INVITED</strong> status won't be auto-opened.
            </p>
        </div>
    </div>
    <template id="meeting-card-template">
        <div class="meeting-item">
            <div class="meeting-row">
                <span class="meeting-title"></span>
                <span class="time-badge"></span>
            </div>
            <div class="meeting-extra">
                <span class="status-badge"></span>
                <span class="countdown"></span>
            </div>
        </div>
    </template>
    <script src="popup.js"></script>
</body>

</html>
